<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Gallery &mdash; SeedSigner LVGL Screens</title>
<!--
  web_gallery — on-the-fly, in-browser render of the WHOLE scenario corpus at one
  language × one resolution. It is a SECOND SHELL over the exact same WASM engine the
  interactive web runner uses: it loads index.js / index.wasm (built from web_runner.cpp)
  and drives the same ss_* C API, sharing the same assets/ (scenario catalogs + font
  packs). No separate build — see docs/web-gallery-todo.md.

  Why the browser is never overwhelmed: you only ever materialize ONE slice
  (one language × one resolution ≈ 140–160 renders). Resolution is a pure runtime
  switch; language is a tiny JSON swap. The ~12k-PNG pre-render matrix is gone.

  How each cell is produced: expand the scenario's context client-side → ss_load_screen
  (ticks + renders synchronously) → read the RGB565 framebuffer straight from the WASM
  heap → expand to RGBA on an offscreen 2D canvas → drop that canvas into the grid at
  native device size. Click a cell to open that screen + scenario in the interactive
  web runner (deep-linked); right-click a cell for the browser's native Save-image-as PNG.
-->
<style>
  :root {
    --bg: #121212; --panel: #1a1a1a; --panel2: #222; --line: #303030;
    --text: #e8e8e8; --dim: #9a9a9a; --accent: #ff9f0a; --err: #e0533d; --ok: #4f9e54;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }

  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10; }
  header .brand { color: var(--accent); font-weight: 700; font-size: 18px; }
  header .rest { color: var(--dim); font-size: 15px; margin-right: auto; }

  label { font-size: 14px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
  select { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 130px; }

  #status { padding: 8px 16px; font-size: 14px; color: var(--dim);
    border-bottom: 1px solid var(--line); background: var(--panel); }
  #status.err { color: var(--err); }

  /* The grid: auto-fill columns, one device screen wide. Track = minmax(--cell-w, 1fr):
     - --cell-w (the min) is set in JS (updateCellWidth) to min(native cell width, available grid
       width), so on a viewport narrower than one device screen — e.g. a 1280×720 cell on a phone —
       the column is capped to what fits and the cell scales down to it (canvas rule below) instead
       of overflowing into a horizontal scroll. It's a definite px, NOT a % expression: a percentage
       inside a grid track's min (min(--cell-w, 100%)) does not reliably resolve against the
       container during track sizing.
     - 1fr (the max) is required: a flexible max makes the track actually constrain its item to the
       column, whereas a fixed-width or max-content track lets the canvas overflow to its 1280 px
       intrinsic width. It also fills the row so columns don't leave a ragged right edge. */
  #grid { display: grid; gap: 16px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell-w, 260px), 1fr)); }
  figure { position: relative; margin: 0; min-width: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex;
    flex-direction: column; gap: 8px; align-items: center; }
  /* Present at native size, but never wider than the cell: max-width:100% + height:auto scales a
     too-wide screenshot (e.g. 1280px on a phone) down to the column width, aspect preserved.
     image-rendering:auto smooths that downscale (pixelated would alias text); at 1:1 it's a no-op.
     The ⬇ download still saves the full native-resolution canvas regardless of display scaling. */
  figure canvas { display: block; image-rendering: auto; background: #000;
    border-radius: 3px; cursor: pointer; max-width: 100%; height: auto; }
  /* Placeholder box shown before a cell renders (lazy) and after it is torn down to cap
     memory. Same black + radius as the canvas so the swap is visually seamless; aspect-ratio +
     max-width:100% (width/ratio set inline) make it fit-to-width exactly like the canvas. A faint
     centered dot hints "not yet rendered" without drawing attention. */
  figure .cell-slot { background: #000; border-radius: 3px; display: flex;
    align-items: center; justify-content: center; max-width: 100%; }
  figure .cell-slot::after { content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--line); }
  /* Per-cell download button (top-right): saves this screen as a PNG with a descriptive
     filename. Subtle by default, brightens when the cell (or the button) is hovered/focused. */
  figure .dl-btn { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    border: 1px solid var(--line); border-radius: 6px; background: rgba(0,0,0,0.55);
    color: var(--text); font-size: 14px; line-height: 1; cursor: pointer;
    opacity: 0.45; transition: opacity 0.12s, background 0.12s; }
  figure:hover .dl-btn { opacity: 0.9; }
  figure .dl-btn:hover { opacity: 1; background: rgba(0,0,0,0.85); }
  figure .dl-btn:focus-visible { opacity: 1; outline: 2px solid var(--text); outline-offset: 1px; }
  figure.err { outline: 1px solid var(--err); }
  /* Landscape-only screens on a square target: a blank box sized to the panel with a short
     explanation, shown in place of a (wrong) render. */
  figure .ph-note { display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 12px; color: var(--dim); font-size: 13px; line-height: 1.4; background: #000;
    border: 1px dashed var(--line); border-radius: 3px; max-width: 100%; }
  /* Caption sits ABOVE the screen — larger so screen name + scenario are easy to scan. */
  figcaption { font-size: 14px; line-height: 1.3; text-align: center;
    /* Reserve a gutter on BOTH sides so the centered title clears the top-right download
       button (which lives in the right gutter); symmetric padding keeps it visually centered.
       Break at the <wbr> underscore opportunities first, char-break a lone segment only if it
       overflows. */
    padding: 0 30px; word-break: normal; overflow-wrap: break-word; }
  figcaption .screen { color: var(--text); font-weight: 700; font-size: 16px; }
  figcaption .scenario { color: var(--dim); font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }

  /* Off-screen host canvas for the SDL/WebGL engine. It renders here; we never look at
     it — every visible cell is painted from the RGB565 framebuffer instead. */
  #engine-holder { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px;
    overflow: hidden; }
</style>
</head>
<body>
<header>
  <span class="brand">SeedSigner LVGL Screens</span>
  <span class="rest">Web Gallery &mdash; every screen, rendered live</span>
  <label>Language
    <!-- Pre-seeded with English so the selector shows a sensible default from the first
         paint (never a blank <select> during the locales.json fetch); loadLocales() clears
         and repopulates it with the full list once that arrives, keeping English selected. -->
    <select id="locale-select"><option value="en" selected>English</option></select>
  </label>
  <label>Resolution
    <select id="res-select">
      <option value="240x240">240 × 240</option>
      <option value="320x240">320 × 240</option>
      <option value="480x320">480 × 320</option>
      <option value="800x480">800 × 480</option>
      <option value="1280x720">1280 × 720</option>
    </select>
  </label>
  <label>Input
    <!-- Input mode changes how screens build: hardware shows the focus/selection
         highlight (how the on-device keypad UI looks), touch shows none. Default
         hardware = the engine default and the historical PNG-gallery look. -->
    <select id="mode-select">
      <option value="1">Hardware</option>
      <option value="0">Touch</option>
    </select>
  </label>
</header>

<div id="status">Loading engine&hellip;</div>
<div id="grid"></div>

<div id="engine-holder"><canvas id="engine-canvas" oncontextmenu="event.preventDefault()"></canvas></div>

<script type="text/javascript">
  // ---- App state ----
  var app = {
    ready: false,
    locale: 'en',
    displayW: 240, displayH: 240,
    loadScreen: null, setResolution: null, setInputMode: null, setStaticRender: null, setPresentRotation: null,
    getWidth: null, getHeight: null, getFramebuffer: null,
    registerManifest: null, packFiles: null, stageBlob: null, stageEndonym: null, loadStaged: null,
  };
  // SDL (emscripten) clobbers document.title with the SDL window title ("seedsigner-web") when
  // main() creates the window — AFTER the HTML <title> renders, so the tab shows the right title
  // then reverts. Capture our intended title now and re-assert it in ssOnReady (fired at the end
  // of main(), the same synchronous task as the clobber, so it wins before any repaint — no flash).
  var PAGE_TITLE = document.title;
  // Bumped on every slice (re)render; an in-flight loop checks it and bails when
  // superseded, so a fast dropdown change can't leave two renders interleaving.
  var renderToken = 0;
  // Cache-bust runtime assets per page load (GitHub Pages sets a fixed Cache-Control).
  var ASSET_BUST = '?_=' + Date.now();

  // Emscripten module config: point the engine at the OFF-SCREEN canvas (we only ever
  // read the framebuffer, never this canvas) and pick up the ready hook.
  var Module = {
    canvas: document.getElementById('engine-canvas'),
    print:    function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
  };

  function setStatus(msg, isErr) {
    var el = document.getElementById('status');
    el.textContent = msg; el.className = isErr ? 'err' : '';
  }

  // ---- Scenario catalog (fetched per locale, expanded client-side) ----
  // Same RFC 7396 merge-patch the C runner_core and the web runner use, so a scenario /
  // translation edit is a static-file swap with no rebuild.
  function mergePatch(target, patch) {
    if (patch && typeof patch === 'object' && !Array.isArray(patch)) {
      var out = (target && typeof target === 'object' && !Array.isArray(target)) ? Object.assign({}, target) : {};
      Object.keys(patch).forEach(function (k) {
        if (patch[k] === null) delete out[k]; else out[k] = mergePatch(out[k], patch[k]);
      });
      return out;
    }
    return patch;
  }
  function slugify(name) {
    return (name || '').replace(/[^0-9A-Za-z_]+/g, '_').replace(/^_+|_+$/g, '') || 'variation';
  }
  function buildCatalog(root) {
    var cat = {};
    Object.keys(root || {}).forEach(function (screen) {
      var def = root[screen] || {};
      var base = def.context || {};
      // Tool-only screenshot.render_as_landscape: portrait-authored screens (pillarboxed
      // scan chrome) render portrait and present 90° CW. Lives at screen level; a
      // variation may override it via its own screenshot block.
      var baseRotate = !!(def.screenshot && def.screenshot.render_as_landscape);
      var entries = [{ name: '(default)', context: base, rotate: baseRotate }];
      (def.variations || []).forEach(function (v) {
        var rot = (v.screenshot && typeof v.screenshot.render_as_landscape === 'boolean')
                    ? v.screenshot.render_as_landscape : baseRotate;
        entries.push({ name: slugify(v.name || 'variation'), context: mergePatch(base, v.context || {}), rotate: rot });
      });
      cat[screen] = entries;
    });
    return cat;
  }

  // ---- Framebuffer capture (identical primitive to the web runner's download button) ----
  // Read the RGB565 plane straight from the WASM heap, expand to RGBA with the EXACT
  // shift the SDL present uses (runner_sdl.cpp) so cells match the on-screen pixels.
  // rotateCW presents portrait-authored screens 90° CW into a landscape canvas.
  //
  // The RGBA ImageData and (rotate-only) source canvas are REUSED across renders — created once per
  // framebuffer size, not per cell. A fresh ImageData is ~3.7 MB at 1280×720; allocating one per
  // render generates garbage ~60×/sec during a fling (~220 MB/s) — far faster than GC reclaims, so
  // the JS heap spikes and the mobile tab crashes (confirmed: forcing GC after 40 renders dropped
  // the heap 87 MB → 20 MB, i.e. it was all reclaimable garbage). Reusing them means the ONLY
  // per-cell allocation is the retained cell canvas, which the caller already caps + tears down.
  var g_fbImg = null, g_fbW = 0, g_fbH = 0;   // reused ImageData (framebuffer → RGBA)
  var g_fbSrc = null;                          // reused source canvas (rotate path only)

  // Canvas POOL: reuse a small fixed set of cell canvases instead of createElement/destroy per
  // render. Recreating a ~1280×720 canvas each render churns a GPU texture alloc+free every time,
  // and Chrome/Android does not reclaim freed GPU textures promptly — so a long scroll (hundreds of
  // renders) accumulates them and the tab eventually crashes even though JS heap and canvas COUNT
  // are bounded. Pooling keeps ~cap textures alive and REPAINTS them (same size → no realloc), so
  // there is no per-render GPU churn. Cells carry NO per-canvas listeners (grid-level delegation in
  // initUI handles clicks), so a pooled canvas is safe to reuse for a different cell. Cleared on a
  // slice change (the framebuffer size may differ) via clearCanvasPool().
  var canvasPool = [];
  function acquireCellCanvas(w, h) {
    var cv = canvasPool.pop() || document.createElement('canvas');
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }  // resize only if needed
    return cv;
  }
  function releaseCellCanvas(cv) {
    cv.remove();
    // Keep it (still sized) for reuse — no zero/resize means its GPU texture is reused, not churned.
    // Cap the pool just above the live cap; free any surplus outright.
    if (canvasPool.length < maxLiveCanvases + 3) canvasPool.push(cv);
    else { cv.width = 0; cv.height = 0; }
  }
  function clearCanvasPool() {
    for (var i = 0; i < canvasPool.length; i++) { canvasPool[i].width = 0; canvasPool[i].height = 0; }
    canvasPool.length = 0;
  }

  function paintFramebuffer(rotateCW) {
    var w = app.getWidth(), h = app.getHeight();
    var ptr = app.getFramebuffer();                      // byte offset into the WASM heap
    var fb = new Uint16Array(Module.HEAPU16.buffer, ptr, w * h);  // re-view (growth-safe)
    if (!g_fbImg || g_fbW !== w || g_fbH !== h) {         // (re)allocate only when the size changes
      g_fbImg = new ImageData(w, h); g_fbW = w; g_fbH = h;
    }
    var d = g_fbImg.data;
    for (var i = 0, p = 0; i < w * h; i++, p += 4) {
      var c = fb[i];
      d[p]     = (c >> 11) << 3;          // R
      d[p + 1] = ((c >> 5) & 0x3F) << 2;  // G
      d[p + 2] = (c & 0x1F) << 3;         // B
      d[p + 3] = 255;
    }
    if (!rotateCW) {
      var out = acquireCellCanvas(w, h);
      out.getContext('2d').putImageData(g_fbImg, 0, 0);  // full-canvas write; overwrites prior content
      return out;
    }
    // Rotate: stage the frame in the reused source canvas, then draw it 90° CW into the cell canvas.
    if (!g_fbSrc) g_fbSrc = document.createElement('canvas');
    if (g_fbSrc.width !== w || g_fbSrc.height !== h) { g_fbSrc.width = w; g_fbSrc.height = h; }
    g_fbSrc.getContext('2d').putImageData(g_fbImg, 0, 0);
    var rot = acquireCellCanvas(h, w);                   // dims swap for the 90° rotation
    var ctx = rot.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);                  // reset any transform left by a prior reuse
    ctx.clearRect(0, 0, rot.width, rot.height);
    ctx.translate(rot.width / 2, rot.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(g_fbSrc, -w / 2, -h / 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);                  // leave clean for the next reuse
    return rot;
  }

  // Download filename for a cell, matching the web runner's downloadPng() scheme:
  // <screen>__<scenario>__<WxH>__<locale>.png, sanitized. '(default)' scenarios → 'default'.
  function cellPngName(fn, entry) {
    var scen = (entry && entry.name && entry.name !== '(default)') ? entry.name : 'default';
    return [fn || 'screen', scen, app.displayW + 'x' + app.displayH, app.locale]
             .filter(Boolean).join('__').replace(/[^0-9A-Za-z_.-]+/g, '_') + '.png';
  }

  // Save a rendered cell canvas as a PNG with a proper name, via a throwaway download link.
  // This is the named-save path (the per-cell download button); the browser's native
  // right-click "Save image as" still works on the canvas, it just names its file generically
  // because a canvas carries no URL to derive a name from.
  function saveCanvasPng(canvas, filename) {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  }

  // Save a rendered cell's canvas as a named PNG. Called from the grid's delegated click handler
  // (initUI) when the ⬇ button is tapped; a torn-down/placeholder cell has no canvas, so it no-ops.
  function downloadCell(fig) {
    if (!fig || !fig._canvas || fig._canvas.tagName !== 'CANVAS') return;
    saveCanvasPng(fig._canvas, cellPngName(fig._cell.fn, fig._cell.entry));
  }

  // ---- Locale packs (option B: JS pre-fetches, the shared loader orchestrates) ----
  // Byte-for-byte the web runner's applyLocaleFonts: fetch each pack file the render
  // layer asks for (ss_pack_files), stage them all, then ss_load_staged once. Latin
  // locales get an empty list and fall back to the compiled-in OpenSans floor.
  var fontCache = {};     // 'locale/file' -> Uint8Array
  var manifestDone = {};  // locale -> true once its manifest.json is fetched+registered (or 404'd)
  var endonymCache = {};  // 'locale/file' -> Uint8Array|null (picker endonym images)

  async function applyLocaleFonts(locale) {
    if (!manifestDone[locale]) {
      try {
        var mresp = await fetch('assets/lang-packs/' + locale + '/manifest.json' + ASSET_BUST);
        if (mresp.ok) {
          var mbytes = new Uint8Array(await mresp.arrayBuffer());
          var mptr = Module._malloc(mbytes.length);
          Module.HEAPU8.set(mbytes, mptr);
          app.registerManifest(mptr, mbytes.length);
          Module._free(mptr);
        }
      } catch (e) { /* no manifest => baked-floor locale */ }
      manifestDone[locale] = true;
    }
    var files;
    try { files = JSON.parse(app.packFiles(locale)); } catch (e) { files = []; }
    for (var i = 0; i < files.length; i++) {
      var key = locale + '/' + files[i];
      if (!fontCache[key]) {
        var resp = await fetch('assets/lang-packs/' + locale + '/' + files[i] + ASSET_BUST);
        if (!resp.ok) throw new Error('pack ' + files[i] + ' (' + resp.status + ')');
        fontCache[key] = new Uint8Array(await resp.arrayBuffer());
      }
    }
    // --- no awaits past this point (stage + load in one flush) ---
    for (var j = 0; j < files.length; j++) {
      var bytes = fontCache[locale + '/' + files[j]];
      var ptr = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, ptr);
      app.stageBlob(files[j], ptr, bytes.length);
      Module._free(ptr);
    }
    app.loadStaged(locale);
  }

  // The locale picker draws each language's name from a pre-rendered endonym IMAGE
  // (no runtime font); those blobs must be staged before the screen builds. Fetch every
  // one the scenario references, then stage them in one flush (mirrors the web runner).
  async function stagePickerEndonyms(ctx) {
    var rows = (ctx && ctx.rows) || [];
    var H = app.displayH, needed = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || !row.locale || !row.image) continue;   // live-text row
      var file = (typeof row.image === 'string') ? row.image : ('endonym_' + H + '.bin');
      needed.push({ locale: row.locale, file: file });
    }
    for (var j = 0; j < needed.length; j++) {
      var key = needed[j].locale + '/' + needed[j].file;
      if (endonymCache[key] === undefined) {
        var resp = await fetch('assets/lang-packs/' + needed[j].locale + '/' + needed[j].file + ASSET_BUST);
        endonymCache[key] = resp.ok ? new Uint8Array(await resp.arrayBuffer()) : null;
      }
    }
    // --- no awaits past this point ---
    for (var k = 0; k < needed.length; k++) {
      var bytes = endonymCache[needed[k].locale + '/' + needed[k].file];
      if (!bytes) continue;
      var ptr = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, ptr);
      app.stageEndonym(needed[k].locale, needed[k].file, ptr, bytes.length);
      Module._free(ptr);
    }
  }

  // ---- Slice render (lazy: cells render only as they scroll into view) ----
  // A full slice is ~150 screens. Materializing every cell's canvas up-front is fine at the
  // small device sizes but catastrophic at 1280×720: ~150 × (1280·720·4 B) ≈ 570 MB of canvas
  // backing store plus ~150 synchronous framebuffer→RGBA paint loops — enough to OOM / freeze a
  // phone. So we lay out sized PLACEHOLDERS immediately (cheap) and render each cell's
  // framebuffer into its box only as it nears the viewport (IntersectionObserver), driving the
  // single shared WASM engine one render at a time. A per-slice memory cap tears down the oldest
  // OFF-SCREEN canvases so live canvas memory stays bounded no matter how big the slice is.
  function raf() { return new Promise(function (r) { requestAnimationFrame(r); }); }

  // --- Lazy-render state (reset per slice by renderSlice) ---
  // A full-size (1280×720 ≈ 3.7 MB) canvas per cell × ~150 cells = ~570 MB — it OOM-crashes a phone.
  // So a cell renders into its box only when it nears the viewport (renderObs), and we hold a HARD
  // CAP of at most `maxLiveCanvases` rendered canvases at once. When a render pushes over the cap we
  // tear down the live cell physically FARTHEST from the viewport (measured with getBoundingClientRect
  // — pure geometry, no reliance on observer callbacks/flags, which proved unreliable for teardown
  // and are untestable headless). Because eviction runs after every render, liveList is bounded by
  // the cap at all times, so total canvas memory is bounded no matter how far you scroll. A torn-down
  // cell re-renders if you scroll back to it.
  var renderObs = null;           // fires when a cell nears the viewport → enqueue its render
  var engineChain = Promise.resolve();  // serializes engine renders (the engine is one global)
  var liveList = [];              // rendered figures currently holding a canvas
  var maxLiveCanvases = 1e9;      // hard cap on live canvases (set per slice in renderSlice)
  var RENDER_MARGIN = '400px 0px';  // begin rendering a cell this far before it enters the viewport

  // Vertical distance (px) from a figure to the viewport: 0 while on-screen, else how far off.
  function distFromViewport(fig) {
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var r = fig.getBoundingClientRect();
    if (r.bottom < 0) return -r.bottom;    // fully above the viewport
    if (r.top > vh)   return r.top - vh;   // fully below the viewport
    return 0;                              // intersecting the viewport
  }

  // A placeholder box sized to the device screen so the grid lays out at full height before anything
  // renders (stable scroll + correct geometry). aspect-ratio + max-width:100% (CSS) make it
  // fit-to-width on a narrow viewport exactly like the rendered canvas.
  function makeSlot() {
    var slot = document.createElement('div');
    slot.className = 'cell-slot';
    slot.style.width = app.displayW + 'px';
    slot.style.aspectRatio = app.displayW + ' / ' + app.displayH;
    return slot;
  }

  // Tear a rendered cell back down to a placeholder, freeing its canvas; it re-renders if it
  // scrolls back near the viewport. Removes itself from liveList so the live set stays accurate.
  function teardownFig(fig) {
    if (!fig._rendered) return;
    if (fig._canvas) {
      // Return the canvas to the pool (kept sized, texture reused) rather than destroying it — see
      // the pool note above for why recreating textures per render crashes mobile over a long scroll.
      // The error-box path stores a <div> in _canvas, which is not poolable; just remove it.
      if (fig._canvas.tagName === 'CANVAS') releaseCellCanvas(fig._canvas);
      else fig._canvas.remove();
    }
    if (fig._dl) { fig._dl.remove(); fig._dl = null; }
    fig._canvas = null;
    fig.classList.remove('err');
    fig._slot = makeSlot();
    fig.appendChild(fig._slot);
    fig._rendered = false;
    var i = liveList.indexOf(fig);
    if (i !== -1) liveList.splice(i, 1);
  }

  // Enforce the hard cap: while over it, tear down the live cell FARTHEST from the viewport. Never
  // evicts an on-screen cell (dist 0) — if every live cell is on-screen (huge viewport vs. a tiny
  // cap) we just hold them. Geometry-driven, so it works regardless of any observer timing.
  function evictLive() {
    while (liveList.length > maxLiveCanvases) {
      var victim = null, farthest = -1;
      for (var i = 0; i < liveList.length; i++) {
        var d = distFromViewport(liveList[i]);
        if (d > farthest) { farthest = d; victim = liveList[i]; }
      }
      if (!victim || farthest === 0) break;   // nothing off-screen to evict
      teardownFig(victim);   // self-removes from liveList
    }
  }

  // Enqueue a cell for rendering when it nears the viewport. Renders are chained through a single
  // promise so the shared engine is only ever driven by ONE render at a time; a stale entry (its
  // slice was superseded) checks the render token and no-ops. A frame is yielded between cells so
  // a burst of newly-visible cells streams in without blocking input.
  function enqueueRender(fig) {
    if (fig._rendered || fig._queued || !fig._needsEngine) return;
    fig._queued = true;
    var myToken = renderToken;
    engineChain = engineChain.then(async function () {
      if (myToken !== renderToken || fig._rendered || !fig._queued) { fig._queued = false; return; }
      fig._queued = false;
      // On a fast fling-scroll many cells flash through the render margin before their turn comes;
      // if this one has since scrolled well away, skip it (renderObs re-enqueues it if it returns).
      if (distFromViewport(fig) > 1200) return;
      await renderCellInto(fig);
      if (myToken !== renderToken) return;   // slice changed mid-render; discard (fig is detached)
      fig._rendered = true;
      liveList.push(fig);
      evictLive();   // may immediately tear this cell back down if it scrolled far while rendering
      await raf();
    });
  }

  // Size the grid columns to one device screen (native landscape device width + the figure's
  // padding/border), but CAPPED to the width actually available so a screen wider than the viewport
  // — e.g. a 1280 px cell on a phone — shrinks the column to fit and the cell scales down to it
  // (fit-to-width) instead of overflowing the page. All cells at a resolution present landscape, so
  // displayW is the max. Re-run on resize (below) so rotating the phone re-fits. A definite px is
  // set (not a CSS % expression) because percentages inside a grid track's min don't resolve here.
  function updateCellWidth() {
    var grid = document.getElementById('grid');
    // Grid content width (clientWidth minus the grid's 16px l/r padding); fall back to the viewport
    // before the grid is laid out. Floor so an absurdly narrow window still yields a usable column.
    var avail = Math.max(140, (grid ? grid.clientWidth : window.innerWidth) - 32);
    var cellW = Math.min(app.displayW + 22, avail);
    document.documentElement.style.setProperty('--cell-w', cellW + 'px');
  }

  // Build one cell's PLACEHOLDER (caption + a device-sized black box) and append it to the grid.
  // No engine work here — that happens lazily in renderCellInto once the cell nears the viewport.
  // Landscape-only screens on a square panel are fully resolved here (a static note, never an
  // engine render). Returns the figure, tagged with the state the lazy machinery reads.
  function buildCellPlaceholder(fn, entry, mode, landscapeOnly) {
    var fig = document.createElement('figure');
    fig._cell = { fn: fn, entry: entry, mode: mode };
    fig._needsEngine = false;  // set true below for real (renderable) cells
    fig._rendered = false;
    fig._queued = false;
    fig._canvas = null;
    fig._dl = null;

    // Caption ABOVE the screen (screen name + scenario), larger for at-a-glance scanning.
    var cap = document.createElement('figcaption');
    cap.innerHTML = '<span class="screen"></span><br><span class="scenario"></span>';
    // Screen name centered; break long names on underscores (not mid-word) by inserting a
    // <wbr> break opportunity after each '_'. Built from DOM nodes rather than innerHTML since
    // the screen name is external catalog data.
    var screenSpan = cap.querySelector('.screen');
    fn.split('_').forEach(function (part, i) {
      if (i > 0) {
        screenSpan.appendChild(document.createTextNode('_'));
        screenSpan.appendChild(document.createElement('wbr'));
      }
      screenSpan.appendChild(document.createTextNode(part));
    });
    cap.querySelector('.scenario').textContent = entry.name;
    fig.appendChild(cap);

    if (landscapeOnly) {
      // Landscape-only screens (portrait-authored, presented rotated) render wrong on a square
      // panel, so at a square resolution we show a blank note cell IN PLACE — not hidden, not
      // (mis)rendered — with a short explanation. No engine work, ever, so it stays a placeholder.
      fig.classList.add('landscape-only');
      var note = document.createElement('div');
      note.className = 'ph-note';
      note.style.width = app.displayW + 'px';
      note.style.aspectRatio = app.displayW + ' / ' + app.displayH;   // fits-to-width like the cells
      note.textContent = 'Landscape-only screen';
      fig.appendChild(note);
    } else {
      fig._needsEngine = true;
      fig._slot = makeSlot();
      fig.appendChild(fig._slot);
    }
    document.getElementById('grid').appendChild(fig);
    return fig;
  }

  // Render one placeholder cell: drive the shared engine for fig._cell and paint its framebuffer
  // into a canvas that replaces the placeholder slot (or an error box). This is the back half of
  // the old renderCell; it assumes fonts for app.locale are already loaded, and runs one-at-a-time
  // (serialized by enqueueRender's promise chain — the engine is a single global).
  async function renderCellInto(fig) {
    var cell = fig._cell, fn = cell.fn, entry = cell.entry, mode = cell.mode;

    // Orientation must be applied BEFORE the load so the screen builds in the right frame.
    app.setPresentRotation(entry.rotate ? 1 : 0);
    // The picker needs its endonym images staged first (async fetch).
    if (fn === 'locale_picker_screen') {
      try { await stagePickerEndonyms(entry.context); } catch (e) { /* fall back to live text */ }
    }
    // Re-assert the gallery's input mode right before building THIS screen. Screens share
    // the engine's single global input mode; a prior cell may have changed it (io_test_screen
    // forces hardware and never restores), so without this every screen after the offender
    // renders in the wrong mode. (Costs one redundant re-render of the previous screen inside
    // ss_set_input_mode — cheap, and never captured.)
    if (app.setInputMode && (mode === 0 || mode === 1)) app.setInputMode(mode);
    // Load ticks+renders once; ss_render_now() settles the frame synchronously (one pass
    // doesn't flush the whole framebuffer at larger sizes / for load transitions) so the full
    // screen is painted before we capture. Static mode (set once on ready) makes animated
    // screens compose their still/final frame — e.g. the opening splash's settled final state.
    var rc;
    try {
      rc = app.loadScreen(fn, JSON.stringify(entry.context));
      if (rc === 1) app.renderNow();
    } catch (e) { rc = -1; }
    var canvas = (rc === 1) ? paintFramebuffer(!!entry.rotate) : null;

    // Swap the placeholder slot for the result.
    if (fig._slot) { fig._slot.remove(); fig._slot = null; }

    if (canvas) {
      // Present at native device pixels (the canvas' own width/height); no CSS scaling. Click a cell
      // to open THAT screen + scenario in the web runner (deep-linked); the ⬇ button saves a PNG.
      // These are handled by GRID-LEVEL event delegation (see initUI) — NOT per-canvas/per-button
      // listeners — so pooled canvases carry no stale handlers when reused for a different cell.
      canvas.title = 'Click to test this screen live · use the ⬇ button to save it as a PNG';
      fig.appendChild(canvas);
      fig._canvas = canvas;

      // Explicit named-save affordance (top-right of the cell); the actual download is wired via
      // delegation (initUI → downloadCell). aria-label carries the target filename for a11y.
      var dl = document.createElement('button');
      dl.type = 'button';
      dl.className = 'dl-btn';
      dl.textContent = '⬇';   // ⬇
      dl.title = 'Download this screen as a PNG';
      dl.setAttribute('aria-label', 'Download ' + cellPngName(fn, entry));
      fig.appendChild(dl);
      fig._dl = dl;
    } else {
      fig.classList.add('err');
      var ph = document.createElement('div');
      ph.style.cssText = 'color:var(--err);font-size:12px;padding:20px;text-align:center;';
      ph.textContent = (rc === 0) ? 'unknown screen' : 'render failed';
      fig.appendChild(ph);
      fig._canvas = ph;   // so a later teardown removes the error box too
    }
  }

  // (Re)build the current slice (one locale × one resolution): supersede any in-flight render,
  // reset the grid + lazy machinery, lay out every cell's placeholder, then let the
  // IntersectionObserver render each one as it nears the viewport.
  async function renderSlice() {
    if (!app.ready) return;
    var token = ++renderToken;

    // Tear down the previous slice's lazy machinery (a stale engineChain entry self-skips on its
    // superseded token; liveList/maxLive are rebuilt below). Clear the canvas pool: a new slice may
    // be a different resolution, so pooled canvases would be the wrong size.
    if (renderObs) { renderObs.disconnect(); renderObs = null; }
    liveList = [];
    clearCanvasPool();

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    updateCellWidth();

    var localeLabel = document.getElementById('locale-select').selectedOptions[0];
    localeLabel = localeLabel ? localeLabel.textContent : app.locale;

    // Fetch + expand this locale's catalog.
    var root;
    try {
      var r = await fetch('assets/scenarios/' + app.locale + '.json' + ASSET_BUST);
      if (!r.ok) throw new Error('scenarios ' + r.status);
      root = await r.json();
    } catch (e) { setStatus('Could not load "' + app.locale + '": ' + e.message, true); return; }
    if (token !== renderToken) return;
    var catalog = buildCatalog(root);

    // Flatten to a work list (screens alphabetical; base scenario first per screen).
    // render_as_landscape screens (portrait-authored, presented rotated to landscape — the
    // pillarboxed camera chrome) are landscape-ONLY: they have no meaning on a square panel
    // like the Pi Zero 240×240 and render wrong there. On a square target we keep them in
    // sequence but render a BLANK placeholder cell (marked here) rather than a wrong render.
    var isSquare = app.displayW === app.displayH;
    var cells = [];
    Object.keys(catalog).sort().forEach(function (fn) {
      (catalog[fn] || []).forEach(function (entry) {
        cells.push({ fn: fn, entry: entry, landscapeOnly: isSquare && !!entry.rotate });
      });
    });

    // Resolve the selected input mode for this slice; renderCellInto re-asserts it before
    // building EACH cell (hardware shows the focus/selection highlight, touch shows none).
    // Per-cell — not once here — because every screen shares the engine's single global
    // input mode, and some screens force their own while building (io_test_screen forces
    // hardware and never restores it). Setting it once would let that leak into every cell
    // rendered after the offender; re-asserting per cell makes each render honor the selector.
    var mode = (document.getElementById('mode-select').value === '0') ? 0 : 1;

    // Hard cap on simultaneously-live canvases, enforced by evictLive after every render. Keep EVERY
    // cell when the whole slice's canvases fit a small budget (the small device sizes — nothing ever
    // tears down); otherwise bound the live set to ~budget/cell-bytes. Deliberately tight for the
    // largest resolution: a full 1280×720 slice is ~570 MB, and even ~30 live canvases (~110 MB CPU,
    // and Chrome/Android also keeps a GPU texture per canvas) crashed a Pixel 8 mid-scroll — so cap
    // to ~48 MB of live backing store (≈13 canvases at 1280×720). Re-renders are cheap on scroll-back.
    var CANVAS_BUDGET = 48 * 1024 * 1024;
    var perCanvas = app.displayW * app.displayH * 4;
    maxLiveCanvases = (cells.length * perCanvas <= CANVAS_BUDGET)
      ? cells.length
      : Math.max(8, Math.floor(CANVAS_BUDGET / perCanvas));

    // Lay out every placeholder up-front (cheap: caption + a sized black box) so the grid is
    // full-height immediately and scrolling is stable; engine renders happen lazily on visibility.
    var figs = [];
    for (var i = 0; i < cells.length; i++) {
      figs.push(buildCellPlaceholder(cells[i].fn, cells[i].entry, mode, cells[i].landscapeOnly));
    }

    var res = app.displayW + '×' + app.displayH;
    setStatus(cells.length + ' screens  •  ' + localeLabel + '  •  ' + res +
              '   (rendered as you scroll · click any screen to test it live · ⬇ saves a cell as a PNG)');

    // renderObs: enqueue a cell for rendering when it comes within RENDER_MARGIN of the viewport,
    // so it's ready by the time it scrolls in. Teardown is NOT observer-driven — evictLive (geometry,
    // runs after each render) enforces the live-canvas cap — so this is the only observer needed.
    renderObs = new IntersectionObserver(function (entries) {
      if (token !== renderToken) return;
      entries.forEach(function (e) { if (e.isIntersecting) enqueueRender(e.target); });
    }, { root: null, rootMargin: RENDER_MARGIN, threshold: 0 });

    figs.forEach(function (fig) { if (fig._needsEngine) renderObs.observe(fig); });
  }

  // ---- Deep-link (res + language + input mode survive a refresh / shared link) ----
  function parseUrl() {
    var p = new URLSearchParams(window.location.search);
    return { lang: p.get('lang'), res: p.get('res'), mode: p.get('mode') };
  }
  function updateUrl() {
    var p = new URLSearchParams();
    if (app.locale) p.set('lang', app.locale);
    var res = document.getElementById('res-select').value;
    if (res) p.set('res', res);
    var mode = document.getElementById('mode-select').value;
    if (mode) p.set('mode', mode);
    window.history.replaceState(null, '', window.location.pathname + '?' + p.toString());
  }

  // ---- Jump to the interactive web runner (deep-linked) ----
  // The gallery IS the site root; the web runner lives at runner/ (relative) in BOTH the
  // deployed site and local dev — serve.sh assembles the SAME layout GitHub Pages does, so
  // this one relative path is correct everywhere (no per-environment detection).
  var RUNNER_BASE = 'runner/';

  // Build a web runner deep-link that reopens THIS cell: screen + scenario (by name;
  // omitted for the default, matching the web runner's own URL scheme) + language +
  // resolution. The web runner reads these query params on load (parseUrl there).
  function runnerUrl(fn, entry) {
    var p = new URLSearchParams();
    p.set('screen', fn);
    if (entry.name && entry.name !== '(default)') p.set('scenario', entry.name);
    if (app.locale) p.set('lang', app.locale);
    p.set('res', app.displayW + 'x' + app.displayH);
    var mode = document.getElementById('mode-select').value;
    if (mode === '0' || mode === '1') p.set('mode', mode);
    return RUNNER_BASE + '?' + p.toString();
  }

  // ---- Engine ready ----
  window.ssOnReady = function (w, h) {
    app.displayW = w; app.displayH = h;
    document.title = PAGE_TITLE;   // re-assert our tab title (SDL clobbered it — see PAGE_TITLE)
    app.loadScreen         = Module.cwrap('ss_load_screen', 'number', ['string', 'string']);
    app.setResolution      = Module.cwrap('ss_set_resolution', null, ['number', 'number']);
    app.setInputMode       = Module.cwrap('ss_set_input_mode', null, ['number']);
    app.setStaticRender    = Module.cwrap('ss_set_static_render', null, ['number']);
    app.setPresentRotation = Module.cwrap('ss_set_present_rotation', null, ['number']);
    app.getWidth           = Module.cwrap('ss_get_width', 'number', []);
    app.getHeight          = Module.cwrap('ss_get_height', 'number', []);
    app.getFramebuffer     = Module.cwrap('ss_get_framebuffer', 'number', []);
    app.renderNow          = Module.cwrap('ss_render_now', null, []);
    app.registerManifest   = Module.cwrap('ss_register_manifest', 'number', ['number', 'number']);
    app.packFiles          = Module.cwrap('ss_pack_files', 'string', ['string']);
    app.stageBlob          = Module.cwrap('ss_stage_blob', null, ['string', 'number', 'number']);
    app.stageEndonym       = Module.cwrap('ss_stage_endonym', null, ['string', 'string', 'number', 'number']);
    app.loadStaged         = Module.cwrap('ss_load_staged', 'number', ['string']);
    // The gallery is a still-corpus (like the screenshot generator): render every screen in
    // STATIC mode so animated screens compose their representative/final frame — the opening
    // splash settles to its final state instead of showing the fade-in. The interactive web
    // runner leaves this OFF (it's a separate WASM instance, so the flag never leaks between them).
    if (app.setStaticRender) app.setStaticRender(1);

    // Stop the engine's continuous rAF main loop. The web_runner runs emscripten_set_main_loop(frame),
    // which every frame ticks LVGL and blits+presents to a WebGL canvas — FOREVER, and keeps ANIMATING
    // whatever screen was last loaded (spinner, animated QR, camera preview). The gallery needs none of
    // that: it drives its own ticks synchronously via ss_load_screen + ss_render_now and reads the
    // framebuffer straight from the WASM heap; the WebGL canvas is never shown. Left running it's
    // constant GPU/CPU work over a long scroll (a suspected slow-crash contributor on mobile). Pause it
    // once, deferred so it runs AFTER main() has actually installed the loop (ssOnReady fires from
    // inside main(), just before emscripten_set_main_loop). Idempotent + guarded for older builds.
    setTimeout(function () { if (Module && Module.pauseMainLoop) Module.pauseMainLoop(); }, 0);

    app.ready = true;
    initUI();
  };
  // The engine may re-announce its backing size after a resolution switch.
  window.ssOnResize = function (w, h) { app.displayW = w; app.displayH = h; };

  // ---- UI wiring ----
  function initUI() {
    // Re-cap the cell width when the window changes (e.g. a phone rotates or the browser resizes):
    // updateCellWidth recomputes --cell-w against the new available width and the cells re-fit via
    // CSS (canvas max-width:100%), with no engine re-render.
    window.addEventListener('resize', updateCellWidth);

    // Grid-level event DELEGATION for cell click (open in the runner) + the ⬇ download button. One
    // handler for the whole grid instead of listeners per canvas/button — so the pooled canvases
    // (reused across cells to avoid GPU texture churn) never carry stale per-cell handlers.
    var grid = document.getElementById('grid');
    grid.addEventListener('click', function (e) {
      var fig = e.target.closest ? e.target.closest('figure') : null;
      if (!fig || !fig._rendered || !fig._cell) return;   // placeholder / note / error cell
      if (e.target.closest('.dl-btn')) { e.preventDefault(); downloadCell(fig); return; }
      var href = runnerUrl(fig._cell.fn, fig._cell.entry);
      if (e.ctrlKey || e.metaKey || e.shiftKey) window.open(href, '_blank');
      else window.location.href = href;
    });
    grid.addEventListener('auxclick', function (e) {   // middle-click → open in a new tab
      if (e.button !== 1) return;
      var fig = e.target.closest ? e.target.closest('figure') : null;
      if (!fig || !fig._rendered || !fig._cell || e.target.closest('.dl-btn')) return;
      e.preventDefault();
      window.open(runnerUrl(fig._cell.fn, fig._cell.entry), '_blank');
    });

    var localeSel = document.getElementById('locale-select');
    var resSel    = document.getElementById('res-select');
    var modeSel   = document.getElementById('mode-select');
    var pending   = parseUrl();

    // Apply a resolution (engine + font px), returning a promise that resolves once the
    // locale's packs are re-registered at the new px. Deliberately mirrors the web runner:
    // ss_set_resolution resets to landscape and rebuilds the profile with the BAKED fonts,
    // so re-run the loader before rendering or pack glyphs flash as .notdef boxes.
    function applyResolution(res) {
      var p = res.split('x');
      app.setResolution(parseInt(p[0], 10), parseInt(p[1], 10));
      return applyLocaleFonts(app.locale);
    }

    // Full (re)render for a locale: fonts, then the slice.
    function reload() {
      applyLocaleFonts(app.locale).then(renderSlice).catch(function (e) {
        setStatus('Locale "' + app.locale + '": ' + (e && e.message ? e.message : e), true);
      });
    }

    localeSel.addEventListener('change', function () {
      app.locale = this.value; updateUrl(); reload();
    });
    resSel.addEventListener('change', function () {
      updateUrl();
      applyResolution(this.value).then(renderSlice).catch(function (e) {
        setStatus('Resolution: ' + (e && e.message ? e.message : e), true);
      });
    });
    modeSel.addEventListener('change', function () {
      // Input mode is pure engine state (no font / resolution work); renderSlice
      // applies the new mode at its start and re-renders every cell.
      updateUrl(); renderSlice();
    });

    // Populate the language dropdown from the shared locale index, then do the first
    // render. Restore res + language from the URL first (font px is per-resolution).
    fetch('assets/scenarios/locales.json' + ASSET_BUST)
      .then(function (r) { return r.json(); })
      .then(function (list) {
        localeSel.innerHTML = '';   // drop the pre-seeded English; repopulate with the full list
        var codes = [];
        (list || []).forEach(function (l) {
          var o = document.createElement('option'); o.value = l.code; o.textContent = l.name;
          localeSel.appendChild(o); codes.push(l.code);
        });
        // Default to English (the dev reference); a valid ?lang= wins on a deep-link.
        app.locale = (pending.lang && codes.indexOf(pending.lang) >= 0)
          ? pending.lang : (codes.indexOf('en') >= 0 ? 'en' : ((list && list[0]) ? list[0].code : 'en'));
      })
      .catch(function () {
        // No locale index (e.g. opened without assets): keep the lone pre-seeded English.
        localeSel.innerHTML = '<option value="en" selected>English</option>';
        app.locale = 'en';
      })
      .then(function () {
        localeSel.value = app.locale;
        // Restore resolution from the URL if valid; else keep the engine's native size.
        var startRes = app.displayW + 'x' + app.displayH;
        if (pending.res) {
          var ok = Array.prototype.some.call(resSel.options, function (o) { return o.value === pending.res; });
          if (ok) startRes = pending.res;
        }
        resSel.value = startRes;
        // Restore input mode from the URL if valid (default: hardware — the engine
        // default and how the on-device screenshots look). renderSlice reads mode-select
        // at its start and applies it, so setting the value here is enough.
        if (pending.mode === '0' || pending.mode === '1') modeSel.value = pending.mode;
        updateUrl();
        return applyResolution(startRes);
      })
      .then(renderSlice)
      .catch(function (e) { setStatus('Startup: ' + (e && e.message ? e.message : e), true); });
  }
</script>
<script async src="index.js"></script>
</body>
</html>
